name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || '103.76.55.173' }}
          username: ${{ secrets.SSH_USER || 'yc-user' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/yc-user/backend-api
            git pull origin main
            ./deploy.sh
